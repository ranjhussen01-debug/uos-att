[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/admin"
  to = "/super_admin.html"
  status = 301

[[redirects]]
  from = "/teacher"
  to = "/teacher_attendance.html"
  status = 301

[[redirects]]
  from = "/departments"
  to = "/departments.html"
  status = 301
