<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوورەوەی سیستەم | کۆلێژی کارگێڕی و ئابووری</title>
    
    <!-- Google Fonts: Tajawal & Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        kurdish: ['Tajawal', 'Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        royal: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            gold: '#f59e0b',
                            goldLight: '#fef3c7',
                            goldDark: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Firebase SDK (v10 compat) & Live Sync Engine -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-service.js"></script>
    
    <style>
        body {
            font-family: 'Tajawal', 'Vazirmatn', sans-serif;
            background-color: #090e17;
            color: #f1f5f9;
            direction: rtl;
        }
        .login-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- Top Header / Crest -->
    <header class="p-6 text-center">
        <div class="inline-flex items-center gap-3 bg-slate-900/80 border border-slate-800 px-5 py-2 rounded-full shadow-lg">
            <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-sm font-black border border-amber-500/30">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="text-right">
                <span class="font-extrabold text-xs sm:text-sm text-slate-200 block">حکومەتی هەرێمی کوردستان - وەزارەتی خوێندنی باڵا</span>
                <span class="text-[11px] text-amber-400 font-bold">کۆلێژی کارگێڕی و ئابووری | دەروازەی چوونەژوورەوە</span>
            </div>
        </div>
    </header>

    <!-- Main Login Container -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md">
            
            <!-- Login Card -->
            <div class="login-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
                <!-- Top Accent Line -->
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-amber-500 via-emerald-500 to-amber-500"></div>

                <!-- Logo & Heading -->
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto mb-4 rounded-3xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 text-3xl font-black shadow-xl shadow-amber-500/20 border-2 border-amber-300">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h2 class="text-2xl font-black text-white tracking-tight">چوونەژوورەوەی سیستەم</h2>
                    <p class="text-xs text-slate-400 mt-1">تکایە ناوی بەکارهێنەر و وشەی نهێنی خۆت بنووسە</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    
                    <!-- Username Input -->
                    <div>
                        <label for="usernameInput" class="block text-xs font-bold text-slate-300 mb-2">
                            <i class="fa-solid fa-user text-amber-400 ml-1"></i>
                            <span>ناوی بەکارهێنەر (Username)</span>
                        </label>
                        <div class="relative">
                            <input type="text" id="usernameInput" required autocomplete="username"
                                class="w-full bg-slate-950/70 border border-slate-700 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 rounded-2xl py-3.5 pr-4 pl-10 text-white placeholder-slate-500 text-sm transition outline-none"
                                placeholder="ناوی بەکارهێنەر بنووسە...">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="passwordInput" class="block text-xs font-bold text-slate-300 mb-2 flex justify-between items-center">
                            <span>
                                <i class="fa-solid fa-lock text-amber-400 ml-1"></i>
                                <span>وشەی نهێنی (Password)</span>
                            </span>
                        </label>
                        <div class="relative">
                            <input type="password" id="passwordInput" required autocomplete="current-password"
                                class="w-full bg-slate-950/70 border border-slate-700 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 rounded-2xl py-3.5 pr-4 pl-12 text-white placeholder-slate-500 text-sm transition outline-none"
                                placeholder="وشەی نهێنی بنووسە...">
                            <button type="button" onclick="togglePasswordVisibility()" 
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 transition text-sm">
                                <i id="passwordEyeIcon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center justify-between text-xs">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="rememberMe" checked class="w-4 h-4 rounded text-amber-500 focus:ring-amber-500/20 bg-slate-900 border-slate-700">
                            <span class="text-slate-300 font-bold">زانیارییەکانم لەبیرمەبە</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn"
                        class="w-full bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black py-4 rounded-2xl shadow-xl shadow-amber-500/20 transition transform active:scale-98 flex items-center justify-center gap-2 text-base">
                        <i class="fa-solid fa-right-to-bracket text-lg"></i>
                        <span>چوونە ژوورەوە</span>
                    </button>
                </form>



            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-900">
        کۆلێژی کارگێڕی و ئابووری - پارێزراوە بە سیستەمی ئاسایشی ئەکادیمی © 2026
    </footer>

    <!-- Authentication JavaScript -->
    <script>
        // System Defined User Accounts
        const SYSTEM_USERS = [
            {
                username: 'superadmin',
                password: 'admin123',
                name: 'سەرپەرشتیاری گشتی (سوپەر ئادمین)',
                role: 'superadmin',
                avatarColor: 'amber'
            },
            {
                username: 'teacher',
                password: 'teacher123',
                name: 'م. کاروان ئەحمەد',
                role: 'teacher',
                deptId: 'dept_accounting',
                deptName: 'بەشی ژمێریاری',
                subject: 'بنەماکانی ژمێریاری',
                stage: '1',
                totalHours: 60,
                avatarColor: 'indigo'
            },
            {
                username: 'accounting',
                password: 'acc123',
                name: 'بەڕێوەبەری بەشی ژمێریاری',
                role: 'department',
                deptId: 'dept_accounting',
                deptName: 'بەشی ژمێریاری',
                avatarColor: 'emerald'
            },
            {
                username: 'business',
                password: 'bus123',
                name: 'بەڕێوەبەری بەشی کارگێڕی کار',
                role: 'department',
                deptId: 'dept_business',
                deptName: 'بەشی کارگێڕی کار',
                avatarColor: 'blue'
            },
            {
                username: 'economics',
                password: 'econ123',
                name: 'بەڕێوەبەری بەشی ئابووری',
                role: 'department',
                deptId: 'dept_economics',
                deptName: 'بەشی ئابووری',
                avatarColor: 'purple'
            },
            {
                username: 'finance',
                password: 'fin123',
                name: 'بەڕێوەبەری بەشی کارگێڕی بەبازاڕکردن',
                role: 'department',
                deptId: 'dept_finance',
                deptName: 'بەشی کارگێڕی بەبازاڕکردن',
                avatarColor: 'teal'
            },
            {
                username: 'statistics',
                password: 'stat123',
                name: 'بەڕێوەبەری بەشی ئامار و زانیاری',
                role: 'department',
                deptId: 'dept_statistics',
                deptName: 'بەشی ئامار و زانیاری',
                avatarColor: 'amber'
            }
        ];

        // Ensure users are loaded in localStorage if not present
        if (!localStorage.getItem('college_auth_users')) {
            localStorage.setItem('college_auth_users', JSON.stringify(SYSTEM_USERS));
        } else {
            try {
                let saved = JSON.parse(localStorage.getItem('college_auth_users'));
                if (Array.isArray(saved) && !saved.some(u => u.username === 'teacher')) {
                    saved.push({
                        username: 'teacher',
                        password: 'teacher123',
                        name: 'م. کاروان ئەحمەد (مامۆستای وانەبێژ)',
                        role: 'teacher',
                        avatarColor: 'indigo'
                    });
                    localStorage.setItem('college_auth_users', JSON.stringify(saved));
                }
            } catch(e) {}
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('passwordEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Auto-fill credentials when demo account is clicked
        function fillCredentials(user, pass) {
            document.getElementById('usernameInput').value = user;
            document.getElementById('passwordInput').value = pass;
            
            // Subtle highlight effect
            const btn = document.getElementById('loginBtn');
            btn.classList.add('ring-4', 'ring-amber-400/50');
            setTimeout(() => btn.classList.remove('ring-4', 'ring-amber-400/50'), 600);
        }

        // Handle Login Submission
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value;

            // Load registered users
            let users = SYSTEM_USERS;
            try {
                const saved = localStorage.getItem('college_auth_users');
                if (saved) users = JSON.parse(saved);
            } catch (err) {
                users = SYSTEM_USERS;
            }

            // Find matching user
            const foundUser = users.find(u => u.username.toLowerCase() === username && u.password === password);

            if (!foundUser) {
                Swal.fire({
                    icon: 'error',
                    title: 'چوونەژوورەوە سەرکەوتوو نەبوو!',
                    text: 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە. تکایە دووبارە هەوڵبدەرەوە.',
                    confirmButtonText: 'باشە',
                    confirmButtonColor: '#b45309',
                    background: '#0f172a',
                    color: '#f8fafc'
                });
                return;
            }

            // Save authenticated session
            const sessionData = {
                username: foundUser.username,
                name: foundUser.name,
                role: foundUser.role,
                deptId: foundUser.deptId || null,
                deptName: foundUser.deptName || null,
                subject: foundUser.subject || null,
                stage: foundUser.stage || '1',
                totalHours: parseInt(foundUser.totalHours) || 60,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('college_auth_user', JSON.stringify(sessionData));

            // Log this login in audit logs
            logAuthAction(foundUser.name, 'چوونەژوورەوەی سەرکەوتوو بۆ سیستەم');

            // Success feedback and redirection
            Swal.fire({
                icon: 'success',
                title: 'بەخێربێیت!',
                html: `<div class="text-sm font-bold text-slate-300 mt-2">${foundUser.name}</div><div class="text-xs text-amber-400 mt-1">ئاراستەکردن بۆ پەڕەی تایبەت...</div>`,
                showConfirmButton: false,
                timer: 1200,
                background: '#0f172a',
                color: '#f8fafc'
            }).then(() => {
                redirectAfterLogin(foundUser);
            });
        }

        function redirectAfterLogin(user) {
            // Check if there is a pending redirect query param
            const urlParams = new URLSearchParams(window.location.search);
            const requestedRedirect = urlParams.get('redirect');

            if (user.role === 'superadmin') {
                if (requestedRedirect && requestedRedirect.includes('super_admin.html')) {
                    window.location.href = requestedRedirect;
                } else {
                    window.location.href = 'super_admin.html';
                }
            } else if (user.role === 'teacher') {
                window.location.href = 'teacher_attendance.html';
            } else if (user.role === 'department') {
                // Redirect directly to their own assigned department
                window.location.href = `departments.html?dept=${user.deptId}`;
            } else {
                window.location.href = 'index.html';
            }
        }

        function logAuthAction(userName, action) {
            try {
                let logs = JSON.parse(localStorage.getItem('college_audit_logs') || '[]');
                logs.unshift({
                    id: Date.now().toString(),
                    action: action,
                    user: userName,
                    timestamp: new Date().toLocaleString('en-US', { hour12: true }),
                    type: 'auth'
                });
                if (logs.length > 50) logs = logs.slice(0, 50);
                localStorage.setItem('college_audit_logs', JSON.stringify(logs));
            } catch(e) {}
        }

        // If already logged in, check if user should be redirected
        document.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('college_auth_user');
            if (current) {
                try {
                    const u = JSON.parse(current);
                    // Check if redirect query param exists
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('force') !== 'true') {
                        // Prefill their username
                        if (document.getElementById('usernameInput')) {
                            document.getElementById('usernameInput').value = u.username;
                        }
                    }
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
