                    fontFamily: {

</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950 p-2 sm:p-0">

    <!-- Top Header / Crest -->
    <header class="p-3 sm:p-6 text-center w-full">
        <div class="inline-flex flex-col sm:flex-row items-center gap-2 sm:gap-3 bg-slate-900/80 border border-slate-800 px-4 py-2 sm:px-5 sm:py-2 rounded-2xl sm:rounded-full shadow-lg max-w-full">

                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="text-center sm:text-right">

            </div>
        </div>
    </header>

    <!-- Main Login Container -->
    <main class="flex-1 flex items-center justify-center p-3 sm:p-4 w-full">
        <div class="w-full max-w-md mx-auto">
            
            <!-- Login Card -->
            <div class="login-card rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-2xl relative overflow-hidden">
                <!-- Top Accent Line -->
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-amber-500 via-emerald-500 to-amber-500"></div>

                <!-- Logo & Heading -->
                <div class="text-center mb-6 sm:mb-8">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto mb-3 sm:mb-4 rounded-2xl sm:rounded-3xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 text-2xl sm:text-3xl font-black shadow-xl shadow-amber-500/20 border-2 border-amber-300">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">چوونەژوورەوەی سیستەم</h2>
                    <p class="text-[11px] sm:text-xs text-slate-400 mt-1">تکایە ناوی بەکارهێنەر و وشەی نهێنی بنووسە</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    
                    <!-- Username Input -->
                    <div>
                        <label for="usernameInput" class="block text-xs font-bold text-slate-300 mb-2">
                            <i class="fa-solid fa-user text-amber-400 ml-1"></i>
                            <span>ناوی بەکارهێنەر (Username)</span>
                        </label>
                        <div class="relative">
                            <input type="text" id="usernameInput" required autocomplete="username"
                                class="w-full bg-slate-950/70 border border-slate-700 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 rounded-2xl py-3.5 pr-4 pl-10 text-white placeholder-slate-500 text-sm transition outline-none"
                                placeholder="ناوی بەکارهێنەر بنووسە...">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label for="passwordInput" class="block text-xs font-bold text-slate-300 mb-2 flex justify-between items-center">
                            <span>
                                <i class="fa-solid fa-lock text-amber-400 ml-1"></i>
                                <span>وشەی نهێنی (Password)</span>
                            </span>
                        </label>
                        <div class="relative">
                            <input type="password" id="passwordInput" required autocomplete="current-password"
                                class="w-full bg-slate-950/70 border border-slate-700 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 rounded-2xl py-3.5 pr-4 pl-12 text-white placeholder-slate-500 text-sm transition outline-none"
                                placeholder="وشەی نهێنی بنووسە...">
                            <button type="button" onclick="togglePasswordVisibility()" 
                                class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 transition text-sm">
                                <i id="passwordEyeIcon" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center justify-between text-xs">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="checkbox" id="rememberMe" checked class="w-4 h-4 rounded text-amber-500 focus:ring-amber-500/20 bg-slate-900 border-slate-700">
                            <span class="text-slate-300 font-bold">زانیارییەکانم لەبیرمەبە</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn"

                        <i class="fa-solid fa-right-to-bracket text-lg"></i>
                        <span>چوونە ژوورەوە</span>
                    </button>

                    <!-- Quick Accounts Button -->
                    <div class="pt-4 border-t border-slate-800 text-center">
                        <button type="button" onclick="openQuickAccountsModal()" 
                            class="w-full text-xs font-bold text-amber-400 hover:text-amber-300 inline-flex items-center justify-center gap-2 bg-slate-900/90 hover:bg-slate-800 py-3 px-4 rounded-xl transition border border-amber-500/20 shadow-sm">

                            <span>بینینی سەرجەم هەژمارەکان (چوونەژوورەوەی خێرا)</span>
                        </button>
                    </div>
                </form>

            </div>

    </main>

    <!-- Quick Accounts Modal -->
    <div id="quickAccountsModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                <div class="flex items-center gap-2 text-amber-400 font-black text-sm">
                    <i class="fa-solid fa-users-viewfinder text-base"></i>
                    <span>سەرجەم هەژمارەکانی سیستەم (کلیک بکە بۆ چوونەژوورەوە)</span>
                </div>
                <button type="button" onclick="closeQuickAccountsModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="p-3 bg-slate-950/30 border-b border-slate-800 flex items-center gap-1.5 overflow-x-auto text-xs font-bold">
                <button type="button" onclick="filterQuickAccounts('all')" id="qTab_all" class="q-tab px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950">هەمووی</button>
                <button type="button" onclick="filterQuickAccounts('admin')" id="qTab_admin" class="q-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">سوپەر ئادمین</button>
                <button type="button" onclick="filterQuickAccounts('dept')" id="qTab_dept" class="q-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">بەشەکان</button>
                <button type="button" onclick="filterQuickAccounts('teacher')" id="qTab_teacher" class="q-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">مامۆستایان</button>
            </div>

            <!-- Accounts List Container -->
            <div id="quickAccountsList" class="p-3 overflow-y-auto space-y-2 flex-1">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="p-4 text-center text-xs text-slate-500 border-t border-slate-900">
        کۆلێژی کارگێڕی و ئابووری - پارێزراوە بە سیستەمی ئاسایشی ئەکادیمی © 2026
    </footer>

            // بەشی کارگێڕی کار

            { id: 'crs_12', deptId: 'dept_economics', dept: 'dept_economics', subject: 'مایکرۆ ئابووری', teacherName: 'د. شوان عەلی', stage: '1', totalHours: 60, username: 'shwan_econ', password: 'shwan123' },

            { id: 'crs_16', deptId: 'dept_economics', dept: 'dept_economics', subject: 'گەشەپێدانی ئابووری', teacherName: 'د. نەبەز عەبدوڵڵا', stage: '4', totalHours: 60, username: 'nabaz_econ', password: 'nabaz123' },

        ];

        const BASE_SYSTEM_USERS = [
            { username: 'superadmin', password: 'admin123', name: 'سەرپەرشتیاری گشتی (سوپەر ئادمین)', role: 'superadmin', avatarColor: 'amber' },
            { username: 'accounting', password: 'acc123', name: 'بەڕێوەبەری بەشی ژمێریاری', role: 'department', deptId: 'dept_accounting', deptName: 'بەشی ژمێریاری', avatarColor: 'emerald' },
            { username: 'business', password: 'bus123', name: 'بەڕێوەبەری بەشی کارگێڕی کار', role: 'department', deptId: 'dept_business', deptName: 'بەشی کارگێڕی کار', avatarColor: 'blue' },
            { username: 'economics', password: 'econ123', name: 'بەڕێوەبەری بەشی ئابووری', role: 'department', deptId: 'dept_economics', deptName: 'بەشی ئابووری', avatarColor: 'purple' },
            { username: 'finance', password: 'fin123', name: 'بەڕێوەبەری بەشی کارگێڕی بەبازاڕکردن', role: 'department', deptId: 'dept_finance', deptName: 'بەشی کارگێڕی بەبازاڕکردن', avatarColor: 'teal' },

        ];

        // Combine base users + all teachers from DEFAULT_COURSES
        const SYSTEM_USERS = [...BASE_SYSTEM_USERS];
        DEFAULT_COURSES.forEach(c => {
            SYSTEM_USERS.push({
                username: c.username.toLowerCase().trim(),
                password: c.password,
                name: c.teacherName,
                role: 'teacher',
                deptId: c.deptId || c.dept,
                deptName: DEPARTMENTS[c.deptId || c.dept]?.name || '',
                subject: c.subject,
                stage: String(c.stage || '1'),
                totalHours: parseInt(c.totalHours) || 60,
                avatarColor: 'indigo'
            });
        });

        // Initialize and sync localStorage users and courses
        (function initLocalDatasets() {
            try {
                // Ensure courses
                let curCourses = JSON.parse(localStorage.getItem('college_courses') || '[]');
                const cMap = new Map();
                DEFAULT_COURSES.forEach(c => cMap.set(c.id, c));
                curCourses.forEach(c => cMap.set(c.id, c));
                localStorage.setItem('college_courses', JSON.stringify(Array.from(cMap.values())));

                // Ensure users
                let curUsers = JSON.parse(localStorage.getItem('college_auth_users') || '[]');
                const uMap = new Map();
                SYSTEM_USERS.forEach(u => uMap.set(u.username.toLowerCase(), u));
                curUsers.forEach(u => {
                    if (u.username) uMap.set(u.username.toLowerCase(), u);
                });
                localStorage.setItem('college_auth_users', JSON.stringify(Array.from(uMap.values())));
            } catch (e) {}
        })();

        // Quick Accounts Modal Functions
        function openQuickAccountsModal() {
            renderQuickAccountsList('all');
            document.getElementById('quickAccountsModal').classList.remove('hidden');
        }

        function closeQuickAccountsModal() {
            document.getElementById('quickAccountsModal').classList.add('hidden');
        }

        function filterQuickAccounts(type) {
            ['all', 'admin', 'dept', 'teacher'].forEach(t => {
                const btn = document.getElementById(`qTab_${t}`);
                if (btn) {
                    if (t === type) {
                        btn.className = 'q-tab px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950';
                    } else {
                        btn.className = 'q-tab px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700';
                    }
                }
            });
            renderQuickAccountsList(type);
        }

        function renderQuickAccountsList(filterType) {
            const listEl = document.getElementById('quickAccountsList');
            if (!listEl) return;
            listEl.innerHTML = '';

            let usersToDisplay = [];
            try {
                usersToDisplay = JSON.parse(localStorage.getItem('college_auth_users') || '[]');
            } catch (e) {
                usersToDisplay = SYSTEM_USERS;
            }
            if (usersToDisplay.length === 0) usersToDisplay = SYSTEM_USERS;

            if (filterType === 'admin') {
                usersToDisplay = usersToDisplay.filter(u => u.role === 'superadmin');
            } else if (filterType === 'dept') {
                usersToDisplay = usersToDisplay.filter(u => u.role === 'department');
            } else if (filterType === 'teacher') {
                usersToDisplay = usersToDisplay.filter(u => u.role === 'teacher');
            }

            usersToDisplay.forEach(u => {
                const item = document.createElement('div');
                item.className = 'p-3 bg-slate-950/60 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-xl transition flex items-center justify-between cursor-pointer';
                item.onclick = () => {
                    fillCredentials(u.username, u.password);
                    closeQuickAccountsModal();
                };

                let roleBadge = '';
                if (u.role === 'superadmin') {
                    roleBadge = '<span class="text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md font-bold">سوپەر ئادمین</span>';
                } else if (u.role === 'department') {
                    roleBadge = '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md font-bold">بەڕێوەبەری بەش</span>';
                } else {
                    const st = u.stage ? `قۆناغی ${u.stage}` : 'مامۆستا';
                    roleBadge = `<span class="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-md font-bold">${st} - ${u.subject || 'وانەبێژ'}</span>`;
                }

                item.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-amber-400 text-xs shrink-0">
                            <i class="fa-solid ${u.role === 'superadmin' ? 'fa-shield-halved' : (u.role === 'department' ? 'fa-building-columns' : 'fa-chalkboard-user')}"></i>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-white flex items-center gap-2">
                                <span>${u.name}</span>
                                ${roleBadge}
                            </div>
                            <div class="text-[11px] text-slate-400 font-mono mt-0.5">
                                User: <span class="text-amber-300 font-bold">${u.username}</span> | Pass: <span class="text-slate-300 font-bold">${u.password}</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="text-xs bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-950 font-bold px-3 py-1.5 rounded-lg transition border border-amber-500/30">
                        هەڵبژاردن
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('passwordEyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Auto-fill credentials when demo account is clicked
        function fillCredentials(user, pass) {
            document.getElementById('usernameInput').value = user;
            document.getElementById('passwordInput').value = pass;
            
            // Subtle highlight effect
            const btn = document.getElementById('loginBtn');
            btn.classList.add('ring-4', 'ring-amber-400/50');
            setTimeout(() => btn.classList.remove('ring-4', 'ring-amber-400/50'), 600);
        }

        // Handle Login Submission
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            const password = document.getElementById('passwordInput').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const originalBtnHtml = loginBtn.innerHTML;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-lg"></i><span>پشکنینی هەژمار...</span>';

            let foundUser = null;

            try {
                // 1. Check registered users in localStorage / SYSTEM_USERS
                let users = SYSTEM_USERS;
                try {
                    const saved = localStorage.getItem('college_auth_users');
                    if (saved) users = JSON.parse(saved);
                } catch (err) {
                    users = SYSTEM_USERS;
                }

                foundUser = users.find(u => (u.username || '').toLowerCase() === username && String(u.password) === password);

                // 2. If not found, check college_courses (for teacher accounts created in departments)
                if (!foundUser) {
                    try {
                        const savedCourses = JSON.parse(localStorage.getItem('college_courses') || '[]');
                        const matchedCourse = savedCourses.find(c => (c.username || '').toLowerCase().trim() === username && String(c.password) === password);
                        if (matchedCourse) {
                            foundUser = {
                                username: matchedCourse.username.toLowerCase().trim(),
                                password: matchedCourse.password,
                                name: matchedCourse.teacherName,
                                role: 'teacher',
                                deptId: matchedCourse.deptId || matchedCourse.dept || 'dept_accounting',
                                deptName: matchedCourse.deptId || matchedCourse.dept || 'dept_accounting',
                                subject: matchedCourse.subject,
                                stage: String(matchedCourse.stage || '1'),
                                totalHours: parseInt(matchedCourse.totalHours) || 60
                            };
                        }
                    } catch (e) {}
                }

                // 3. If still not found, check Firebase Firestore directly (for accounts created on other devices)
                if (!foundUser && window.FirebaseService && typeof window.FirebaseService.getDb === 'function') {
                    const db = window.FirebaseService.getDb();
                    if (db) {
                        try {
                            // Check 'users' collection
                            const userDoc = await db.collection('users').doc(username).get();
                            if (userDoc.exists && String(userDoc.data().password) === password) {
                                foundUser = userDoc.data();
                            } else {
                                // Check 'courses' collection
                                const courseSnap = await db.collection('courses').where('username', '==', username).get();
                                if (!courseSnap.empty) {
                                    courseSnap.forEach(doc => {
                                        const c = doc.data();
                                        if (String(c.password) === password) {
                                            foundUser = {
                                                username: c.username.toLowerCase().trim(),
                                                password: c.password,
                                                name: c.teacherName,
                                                role: 'teacher',
                                                deptId: c.deptId || c.dept || 'dept_accounting',
                                                deptName: c.deptId || c.dept || 'dept_accounting',
                                                subject: c.subject,
                                                stage: String(c.stage || '1'),
                                                totalHours: parseInt(c.totalHours) || 60
                                            };
                                        }
                                    });
                                }
                            }
                        } catch (cloudErr) {
                            console.warn('[Login] Firebase cloud lookup error:', cloudErr);
                        }
                    }
                }
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = originalBtnHtml;
            }

            if (!foundUser) {
                Swal.fire({
                    icon: 'error',
                    title: 'چوونەژوورەوە سەرکەوتوو نەبوو!',
                    text: 'ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە. تکایە دووبارە هەوڵبدەرەوە.',
                    confirmButtonText: 'باشە',
                    confirmButtonColor: '#b45309',
                    background: '#0f172a',
                    color: '#f8fafc'
                });
                return;
            }

            // Sync found user into local storage so offline access works
            try {
                let localUsers = JSON.parse(localStorage.getItem('college_auth_users') || '[]');
                const idx = localUsers.findIndex(u => (u.username || '').toLowerCase() === foundUser.username.toLowerCase());
                if (idx >= 0) {
                    localUsers[idx] = Object.assign(localUsers[idx], foundUser);
                } else {
                    localUsers.push(foundUser);
                }
                localStorage.setItem('college_auth_users', JSON.stringify(localUsers));
            } catch (e) {}

            // Save authenticated session
            const sessionData = {
                username: foundUser.username,
                name: foundUser.name,
                role: foundUser.role,
                deptId: foundUser.deptId || foundUser.dept || null,
                deptName: foundUser.deptName || foundUser.dept || null,
                subject: foundUser.subject || null,
                stage: String(foundUser.stage || '1'),
                totalHours: parseInt(foundUser.totalHours) || 60,
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('college_auth_user', JSON.stringify(sessionData));

            // Log this login in audit logs
            logAuthAction(foundUser.name, 'چوونەژوورەوەی سەرکەوتوو بۆ سیستەم');

            // Success feedback and redirection
            Swal.fire({
                icon: 'success',
                title: 'بەخێربێیت!',
                html: `<div class="text-sm font-bold text-slate-300 mt-2">${foundUser.name}</div><div class="text-xs text-amber-400 mt-1">ئاراستەکردن بۆ پەڕەی تایبەت...</div>`,
                showConfirmButton: false,
                timer: 1200,
                background: '#0f172a',
                color: '#f8fafc'
            }).then(() => {
                redirectAfterLogin(foundUser);
            });
        }

        function redirectAfterLogin(user) {
            // Check if there is a pending redirect query param
            const urlParams = new URLSearchParams(window.location.search);
            const requestedRedirect = urlParams.get('redirect');

            if (user.role === 'superadmin') {
                if (requestedRedirect && requestedRedirect.includes('super_admin.html')) {
                    window.location.href = requestedRedirect;
                } else {
                    window.location.href = 'super_admin.html';
                }
            } else if (user.role === 'teacher') {
                window.location.href = 'teacher_attendance.html';
            } else if (user.role === 'department') {
                // Redirect directly to their own assigned department
                window.location.href = `departments.html?dept=${user.deptId}`;
            } else {
                window.location.href = 'index.html';
            }
        }

        function logAuthAction(userName, action) {
            try {
                let logs = JSON.parse(localStorage.getItem('college_audit_logs') || '[]');
                logs.unshift({
                    id: Date.now().toString(),
                    action: action,
                    user: userName,
                    timestamp: new Date().toLocaleString('en-US', { hour12: true }),
                    type: 'auth'
                });
                if (logs.length > 50) logs = logs.slice(0, 50);
                localStorage.setItem('college_audit_logs', JSON.stringify(logs));
            } catch(e) {}
        }

        // If already logged in, check if user should be redirected
        document.addEventListener('DOMContentLoaded', () => {
            const current = localStorage.getItem('college_auth_user');
            if (current) {
                try {
                    const u = JSON.parse(current);
                    // Check if redirect query param exists
                    const params = new URLSearchParams(window.location.search);
                    if (params.get('force') !== 'true') {
                        // Prefill their username
                        if (document.getElementById('usernameInput')) {
                            document.getElementById('usernameInput').value = u.username;
                        }
                    }
                } catch(e) {}
            }
        });
    </script>
